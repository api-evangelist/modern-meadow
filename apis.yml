aid: modern-meadow
name: Modern Meadow
description: 'Modern Meadow is a bio-design and materials-science company founded in
  2011 in Brooklyn by Andras Forgacs, Francoise Marga, Gabor Forgacs and Karoly Jakab,
  now headquartered in Nutley / Pine Brook, New Jersey, where it operates an innovation
  lab opened in 2017. The company applies synthetic biology and protein engineering
  to build animal-free, bio-fabricated alternatives to leather and other petrochemical-derived
  materials, through the Bio-Alloy technology platform (an alloy of engineered proteins
  and bio-based polymers), the BIO-VERA material launched in 2023, and its current
  flagship INNOVERA, a next-generation leather alternative made from plant proteins,
  biopolymers and recycled rubber with more than 80% renewable carbon content. It sells
  into interiors, fashion and accessories, footwear, and automotive, and has partnered
  with BASF, tannery HELLER-LEDER (a 2026 European joint venture) and Allbirds (the
  Terralux footwear line). Modern Meadow has raised roughly $236M. It is a materials
  manufacturer, not a software vendor: profiling on 2026-08-01 found no public API,
  no developer portal, no documentation, no OpenAPI/GraphQL/MCP surface, no /.well-known/
  documents, and no GitHub organization. Its corporate site (modernmeadow.com, Craft
  CMS) largely redirects to the product site innovera-world.com.'
